name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src tests --output-format json --output-file ruff-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ruff-report
          path: ruff-report.json
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[oracle,dev]'
      - run: pytest
